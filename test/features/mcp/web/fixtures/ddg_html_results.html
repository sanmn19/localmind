<!-- Real-shape html.duckduckgo.com/html results page (stable known schema).
     Results sit in <div class="result">; each holds an <a class="result__a">
     whose href may be a /l/?uddg=<encoded> redirect that must be unwrapped,
     plus an <a class="result__snippet"> for the description. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DuckDuckGo</title>
</head>
<body>
<div class="results">
    <div class="result results_links results_links_deep">
        <h2 class="result__title">
            <a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Fa&amp;rut=a1b2c3">HTML Result A</a>
        </h2>
        <a class="result__snippet" href="https://example.com/a">Snippet X text here</a>
    </div>
    <div class="result">
        <h2 class="result__title">
            <a class="result__a" href="https://example.com/b">HTML Result B</a>
        </h2>
        <a class="result__snippet" href="https://example.com/b">Snippet Y text here</a>
    </div>
</div>
</body>
</html>
