<!-- Real-shape DuckDuckGo Lite results page (stable known schema).
     Title rows hold <a class="result-link"> and the following row holds
     the snippet, sometimes as <td class="result-snippet"> and sometimes
     as <span class="result-snippet">. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>DuckDuckGo</title>
</head>
<body>
<table>
    <tr>
        <td class="result-link"><a class="result-link" href="https://example.com/a">Example A</a></td>
    </tr>
    <tr>
        <td>&nbsp;</td>
        <td class="result-snippet">
        Snippet A text here
        </td>
    </tr>
    <tr>
        <td class="result-link"><a class="result-link" href="https://example.com/b">Example B</a></td>
    </tr>
    <tr>
        <td><span class="result-snippet">Snippet B text here</span></td>
    </tr>
</table>
</body>
</html>
